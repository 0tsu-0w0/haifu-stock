# Supabase の無料プランは、使われないとプロジェクトを一時停止する(Issue #18)。
# 2026-11 に、API への読み取り(2日おき)だけでは止まることが分かったので、
# 毎日データベースに直接つないで、小さな「生きている印」の行を書き込む。
# 止まっていたら(HTTP 540・つながらない)このジョブが失敗し、GitHub から通知が届く。
# 必要な秘密情報: SUPABASE_DB_URL(バックアップと同じ。Session pooler の接続文字列)
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 3 * * *' # 毎日 12:17(日本時間)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      SUPABASE_URL: https://jrzbtjlpufezxqkrntoj.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_DL8PZ5h-UniUk_mZ2wkFag_lfufpRR_
    steps:
      - name: 止まっていないか確かめる
        run: |
          status=$(curl -s -o /tmp/body -w '%{http_code}' --retry 3 --retry-delay 20 \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            "$SUPABASE_URL/rest/v1/circles?select=id&limit=1")
          echo "HTTP $status"
          if [ "$status" = "540" ]; then
            echo "::error::Supabase のプロジェクトが一時停止しています。管理画面で Resume project を押してください"
            exit 1
          fi

      - name: データベースに生きている印を書き込む
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "$DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL を、リポジトリの Secrets に置いてください"
            exit 1
          fi
          DB_URL=$(printf '%s' "$DB_URL" | tr -d '\r\n' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -c \
            "insert into app.keepalive (id, at, runs) values (1, now(), 1)
             on conflict (id) do update set at = excluded.at, runs = app.keepalive.runs + 1;
             select 'ok', at, runs from app.keepalive where id = 1;"
